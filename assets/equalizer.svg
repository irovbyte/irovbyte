<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 64" width="100%" height="64">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <filter id="eqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect width="650" height="64" rx="32" fill="#0A0C16" stroke="#1F2538" stroke-width="1.2" />

  <!-- Animated Sound Bars (Left Side) -->
  <g transform="translate(35, 18)" filter="url(#eqGlow)">
    <!-- Bar 1 -->
    <rect x="0" y="8" width="4" height="20" rx="2" fill="#00E5FF">
      <animate attributeName="height" values="8;24;14;28;10;24;8" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;4;14;0;18;4;20" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="8" y="4" width="4" height="24" rx="2" fill="#00E5FF">
      <animate attributeName="height" values="24;10;26;12;28;14;24" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="4;18;2;16;0;14;4" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="16" y="12" width="4" height="16" rx="2" fill="#7928CA">
      <animate attributeName="height" values="14;28;8;22;14;26;14" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="14;0;20;6;14;2;14" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="24" y="6" width="4" height="22" rx="2" fill="#FF007F">
      <animate attributeName="height" values="22;12;28;14;20;8;22" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="6;16;0;14;8;20;6" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="32" y="14" width="4" height="14" rx="2" fill="#FF007F">
      <animate attributeName="height" values="12;26;16;28;10;22;12" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="16;2;12;0;18;6;16" dur="1.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Headphones Icon / Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Header line -->
    <text x="95" y="27" fill="#00E5FF" font-size="12" font-weight="700" letter-spacing="1.5">
      CODING SOUNDTRACK &amp; VIBE
    </text>

    <!-- Sub line -->
    <text x="95" y="45" fill="#E2E8F0" font-size="13" font-weight="500">
      Synthwave • Dark Cyberpunk • High-Concurrency Flow State
    </text>

    <!-- Live indicator -->
    <circle cx="585" cy="32" r="4" fill="#00FF88" filter="url(#eqGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="596" y="36" fill="#00FF88" font-size="11" font-weight="600" letter-spacing="1">FLOW</text>
  </g>
</svg>
