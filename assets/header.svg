<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D" />
      <stop offset="50%" stop-color="#0D0F1B" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>

    <!-- Neon Wave Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Bloom Filter -->
    <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" stroke="#1F2438" stroke-width="1.5" />

  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="50" r="100" fill="#00E5FF" opacity="0.08" filter="url(#softBloom)" />
  <circle cx="850" cy="70" r="120" fill="#7928CA" opacity="0.12" filter="url(#softBloom)" />
  <circle cx="500" cy="220" r="140" fill="#FF007F" opacity="0.08" filter="url(#softBloom)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
  </g>

  <!-- Decorative Corner Tech Accents -->
  <path d="M 30,50 L 30,30 L 50,30" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.7" />
  <path d="M 970,50 L 970,30 L 950,30" fill="none" stroke="#7928CA" stroke-width="2" opacity="0.7" />
  <circle cx="30" cy="30" r="3" fill="#00E5FF" />
  <circle cx="970" cy="30" r="3" fill="#7928CA" />

  <!-- Subtle Wave Paths at the bottom -->
  <path d="M 0,210 Q 250,170 500,205 T 1000,195 L 1000,240 L 0,240 Z" fill="#00E5FF" opacity="0.06" />
  <path d="M 0,220 Q 300,185 600,215 T 1000,210 L 1000,240 L 0,240 Z" fill="#7928CA" opacity="0.10" />
  <path d="M 0,225 Q 350,205 700,225 T 1000,220 L 1000,240 L 0,240 Z" fill="url(#neonGrad)" opacity="0.4" />

  <!-- Main Title: ROMAN ZORIPOV -->
  <g text-anchor="middle">
    <!-- Top Monospace Tag -->
    <text x="500" y="55" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="600" letter-spacing="4" opacity="0.9">
      &lt; SYSTEMS &amp; NETWORK ARCHITECTURE /&gt;
    </text>

    <!-- Large Glow Title -->
    <text x="500" y="112" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" letter-spacing="4" filter="url(#neonGlow)">
      ROMAN ZORIPOV
    </text>

    <!-- Subtitle -->
    <text x="500" y="148" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="2">
      Systems &amp; Network Software Engineer • Founder @ OctoCore
    </text>

    <!-- Tech Badges inside SVG -->
    <g transform="translate(160, 168)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="26" rx="13" fill="#131726" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5" />
      <text x="70" y="17" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">.NET 10 • C# 14</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="170" height="26" rx="13" fill="#131726" stroke="#7928CA" stroke-width="1" stroke-opacity="0.5" />
      <text x="240" y="17" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">Wintun &amp; Linux TUN</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="165" height="26" rx="13" fill="#131726" stroke="#FF007F" stroke-width="1" stroke-opacity="0.5" />
      <text x="422" y="17" fill="#FF77B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">OBXODKA-STREAM</text>

      <!-- Pill 4 -->
      <rect x="520" y="0" width="160" height="26" rx="13" fill="#131726" stroke="#00FF88" stroke-width="1" stroke-opacity="0.5" />
      <text x="600" y="17" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">SkiaSharp 120 FPS</text>
    </g>
  </g>
</svg>
