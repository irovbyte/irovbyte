<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="270">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D" />
      <stop offset="50%" stop-color="#0D0F1B" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>

    <!-- Neon Wave Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Bloom Filter -->
    <filter id="softBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="270" rx="16" fill="url(#bgGrad)" stroke="#1F2438" stroke-width="1.5" />

  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="50" r="110" fill="#00E5FF" opacity="0.08" filter="url(#softBloom)" />
  <circle cx="850" cy="70" r="130" fill="#7928CA" opacity="0.12" filter="url(#softBloom)" />
  <circle cx="500" cy="250" r="150" fill="#FF007F" opacity="0.08" filter="url(#softBloom)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="45" x2="1000" y2="45" />
    <line x1="0" y1="90" x2="1000" y2="90" />
    <line x1="0" y1="135" x2="1000" y2="135" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="225" x2="1000" y2="225" />
    <line x1="200" y1="0" x2="200" y2="270" />
    <line x1="400" y1="0" x2="400" y2="270" />
    <line x1="600" y1="0" x2="600" y2="270" />
    <line x1="800" y1="0" x2="800" y2="270" />
  </g>

  <!-- Decorative Corner Tech Accents -->
  <path d="M 30,50 L 30,30 L 50,30" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.7" />
  <path d="M 970,50 L 970,30 L 950,30" fill="none" stroke="#7928CA" stroke-width="2" opacity="0.7" />
  <circle cx="30" cy="30" r="3" fill="#00E5FF" />
  <circle cx="970" cy="30" r="3" fill="#7928CA" />

  <!-- Subtle Wave Paths at the bottom -->
  <path d="M 0,240 Q 250,200 500,235 T 1000,225 L 1000,270 L 0,270 Z" fill="#00E5FF" opacity="0.06" />
  <path d="M 0,250 Q 300,215 600,245 T 1000,240 L 1000,270 L 0,270 Z" fill="#7928CA" opacity="0.10" />
  <path d="M 0,255 Q 350,235 700,255 T 1000,250 L 1000,270 L 0,270 Z" fill="url(#neonGrad)" opacity="0.4" />

  <!-- Main Title: ROMAN ZORIPOV -->
  <g text-anchor="middle">
    <!-- Top Monospace Tag -->
    <text x="500" y="48" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="12" font-weight="600" letter-spacing="4" opacity="0.9">
      &lt; FULL-STACK .NET • SYSTEMS • CLOUD &amp; SQL ARCHITECT /&gt;
    </text>

    <!-- Large Glow Title -->
    <text x="500" y="98" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="42" font-weight="900" letter-spacing="4" filter="url(#neonGlow)">
      ROMAN ZORIPOV
    </text>

    <!-- Subtitle -->
    <text x="500" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="1.5">
      .NET 10 / ASP.NET Core • Blazor &amp; MAUI • Systems Networking • SQL Architecture
    </text>

    <!-- Tech Badges inside SVG (Row 1) -->
    <g transform="translate(140, 150)">
      <!-- Pill 1: .NET 10 -->
      <rect x="0" y="0" width="160" height="25" rx="12.5" fill="#131726" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6" />
      <text x="80" y="16.5" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">.NET 10 • C# 14</text>

      <!-- Pill 2: ASP.NET Core & Blazor -->
      <rect x="180" y="0" width="200" height="25" rx="12.5" fill="#131726" stroke="#7928CA" stroke-width="1" stroke-opacity="0.6" />
      <text x="280" y="16.5" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">ASP.NET Core • Blazor</text>

      <!-- Pill 3: SQL & PostgreSQL -->
      <rect x="400" y="0" width="180" height="25" rx="12.5" fill="#131726" stroke="#FF007F" stroke-width="1" stroke-opacity="0.6" />
      <text x="490" y="16.5" fill="#FF77B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">SQL • PostgreSQL</text>

      <!-- Pill 4: MAUI -->
      <rect x="600" y="0" width="120" height="25" rx="12.5" fill="#131726" stroke="#00FF88" stroke-width="1" stroke-opacity="0.6" />
      <text x="660" y="16.5" fill="#00FF88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">.NET MAUI</text>
    </g>

    <!-- Tech Badges inside SVG (Row 2) -->
    <g transform="translate(180, 185)">
      <!-- Pill 5: Wintun & Linux TUN -->
      <rect x="0" y="0" width="190" height="25" rx="12.5" fill="#131726" stroke="#7928CA" stroke-width="1" stroke-opacity="0.5" />
      <text x="95" y="16.5" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">Wintun &amp; Linux TUN</text>

      <!-- Pill 6: OBXODKA-STREAM -->
      <rect x="210" y="0" width="190" height="25" rx="12.5" fill="#131726" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5" />
      <text x="305" y="16.5" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">OBXODKA-STREAM</text>

      <!-- Pill 7: SkiaSharp 120 FPS -->
      <rect x="420" y="0" width="220" height="25" rx="12.5" fill="#131726" stroke="#FF007F" stroke-width="1" stroke-opacity="0.5" />
      <text x="530" y="16.5" fill="#FF77B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">SkiaSharp 120 FPS UI</text>
    </g>
  </g>
</svg>
